name: Privora 4.0 RC3 — Salvage Last Real Source Baselines v27

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salvage:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      LAST_LIVE_UX_COMMIT: 3a98a81a2212eafe840f6c5ebeff4a3cf446687b

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install salvage tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            unzip zip xz-utils file
          sudo apt-get clean

      - name: Verify known last live UX commit
        shell: bash
        run: |
          set -euxo pipefail

          git cat-file -e "$LAST_LIVE_UX_COMMIT^{commit}"

          echo 'Selected salvage commit:'
          git show -s \
            --date=iso \
            --format='commit=%H%nparent=%P%nauthor_date=%ad%nsubject=%s' \
            "$LAST_LIVE_UX_COMMIT"

          SUBJECT=$(git show -s --format='%s' "$LAST_LIVE_UX_COMMIT")
          if [ "$SUBJECT" != 'Implement Privora live UX recovery steps' ]; then
            echo "ERROR: expected the known live UX recovery commit, got: $SUBJECT" >&2
            exit 27
          fi

      - name: Export last real repository source snapshot
        shell: bash
        run: |
          set -euxo pipefail

          SALVAGE="$RUNNER_TEMP/privora-v27-salvage"
          rm -rf "$SALVAGE"
          mkdir -p \
            "$SALVAGE/output" \
            "$SALVAGE/work/commit-tree" \
            "$SALVAGE/work/rc2-zips"

          echo "SALVAGE=$SALVAGE" >> "$GITHUB_ENV"

          # Export the exact committed tree without .git metadata.
          git archive "$LAST_LIVE_UX_COMMIT" \
            | tar -x -C "$SALVAGE/work/commit-tree"

          echo '--- last live UX commit tree ---' \
            | tee "$SALVAGE/output/COMMIT-TREE-INVENTORY.txt"
          find "$SALVAGE/work/commit-tree" -type f \
            -printf '%s\t%p\n' \
            | sed "s#${SALVAGE}/work/commit-tree/##" \
            | sort \
            | tee -a "$SALVAGE/output/COMMIT-TREE-INVENTORY.txt"

          echo '--- likely build/source control files ---' \
            | tee "$SALVAGE/output/KEY-FILES.txt"
          find "$SALVAGE/work/commit-tree" -type f \
            \( -name 'VERSION' \
               -o -name 'build.sh' \
               -o -name '*.yml' \
               -o -name '*.yaml' \
               -o -name '*.py' \
               -o -name '*.sh' \
               -o -name 'Makefile' \
               -o -name 'README.md' \) \
            -printf '%p\n' \
            | sed "s#${SALVAGE}/work/commit-tree/##" \
            | sort \
            | tee -a "$SALVAGE/output/KEY-FILES.txt"

          # Package this exact committed source snapshot.
          (
            cd "$SALVAGE/work/commit-tree"
            zip -qr "$SALVAGE/output/Privora-Last-Live-UX-Commit-3a98a81-Source.zip" .
          )

          test -s "$SALVAGE/output/Privora-Last-Live-UX-Commit-3a98a81-Source.zip"
          unzip -t "$SALVAGE/output/Privora-Last-Live-UX-Commit-3a98a81-Source.zip" >/dev/null

      - name: Recover deleted RC2 source ZIP blobs from Git history
        shell: bash
        run: |
          set -euxo pipefail

          LIST="$SALVAGE/output/HISTORICAL-RC2-ZIP-OBJECTS.txt"
          : > "$LIST"

          git rev-list --objects --all \
            | grep -Ei ' [^ ]*Privora-4\.0-RC2[^ ]*(Web-Source|Source)[^ ]*\.zip$' \
            | sort -u \
            | tee "$LIST" || true

          index=0
          recovered=0

          while read -r object_id historical_path; do
            [ -n "${object_id:-}" ] || continue
            [ -n "${historical_path:-}" ] || continue

            [ "$(git cat-file -t "$object_id" 2>/dev/null || true)" = 'blob' ] || continue

            index=$((index + 1))
            candidate="$SALVAGE/work/rc2-zips/rc2-source-${index}.zip"
            git cat-file blob "$object_id" > "$candidate"

            if head -c 100 "$candidate" \
              | grep -Fq 'version https://git-lfs.github.com/spec/v1'; then
              echo "SKIP Git LFS pointer: $object_id $historical_path" \
                | tee -a "$SALVAGE/output/RC2-RECOVERY-RESULTS.txt"
              rm -f "$candidate"
              continue
            fi

            if ! unzip -t "$candidate" >/dev/null 2>&1; then
              echo "SKIP non-ZIP blob: $object_id $historical_path" \
                | tee -a "$SALVAGE/output/RC2-RECOVERY-RESULTS.txt"
              rm -f "$candidate"
              continue
            fi

            sha=$(sha256sum "$candidate" | awk '{print $1}')
            bytes=$(stat -c '%s' "$candidate")
            recovered=$((recovered + 1))

            final="$SALVAGE/output/Recovered-RC2-Source-${recovered}-${object_id:0:12}.zip"
            mv "$candidate" "$final"

            echo "RECOVERED object=$object_id sha256=$sha bytes=$bytes historical_path=$historical_path output=$(basename "$final")" \
              | tee -a "$SALVAGE/output/RC2-RECOVERY-RESULTS.txt"

            unzip -Z1 "$final" \
              | head -n 400 \
              > "$SALVAGE/output/Recovered-RC2-Source-${recovered}-${object_id:0:12}-CONTENTS.txt"
          done < "$LIST"

          echo "Recovered valid RC2 source ZIP blobs: $recovered" \
            | tee "$SALVAGE/output/RC2-RECOVERY-COUNT.txt"

      - name: Produce reconstruction evidence manifest
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo 'Privora RC3 source salvage v27'
            echo
            echo "Last known live UX commit:"
            git show -s \
              --date=iso \
              --format='  commit: %H%n  date: %ad%n  subject: %s' \
              "$LAST_LIVE_UX_COMMIT"
            echo
            echo 'Purpose:'
            echo '  Preserve the last concrete committed Privora source baseline and any'
            echo '  deleted RC2 source ZIP blobs before reconstructing the lost RC3 tree.'
            echo
            echo 'Important:'
            echo '  None of these outputs are the lost canonical RC3 v21 source ZIP.'
            echo '  They are reconstruction inputs and must not be labeled as byte-identical RC3.'
          } | tee "$SALVAGE/output/RECONSTRUCTION-EVIDENCE.txt"

          (
            cd "$SALVAGE/output"
            sha256sum \
              Privora-Last-Live-UX-Commit-3a98a81-Source.zip \
              Recovered-RC2-Source-*.zip \
              2>/dev/null || \
            sha256sum Privora-Last-Live-UX-Commit-3a98a81-Source.zip
          ) | tee "$SALVAGE/output/SHA256SUMS.txt"

          echo 'Output inventory:'
          find "$SALVAGE/output" -maxdepth 1 -type f \
            -printf '%s\t%f\n' \
            | sort

      - name: Upload reconstruction inputs
        uses: actions/upload-artifact@v6
        with:
          name: Privora-4.0-RC3-v27-Reconstruction-Inputs
          path: ${{ runner.temp }}/privora-v27-salvage/output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
