name: Build Privora 4.0 RC4 v33 — Privora Boot Center 1.0 & Modern Boot Core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af --volumes || true
          sudo apt-get clean || true
          df -h /

      - name: Select exact Privora RC4 v33 source
        shell: bash
        run: |
          set -euxo pipefail
          EXPECTED_SHA256='b28914c385d3c5e94f46f6e51928825537dc9d7aa2dbb9fbab5043d14157f8d5'
          EXPECTED_NAME='Privora-4.0-RC4-Privora-Boot-Center-v33-Web-Source.zip'

          SOURCE_ZIP=$(find . -maxdepth 3 -type f -name "$EXPECTED_NAME" -print -quit)
          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: $EXPECTED_NAME is not present in the repository." >&2
            find . -maxdepth 3 -type f -printf '%p\n' | sort | head -n 400 >&2
            exit 33
          fi

          actual=$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')
          echo "source=$SOURCE_ZIP"
          echo "sha256=$actual"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo 'ERROR: RC4 v33 source checksum mismatch.' >&2
            echo "Expected: $EXPECTED_SHA256" >&2
            echo "Actual:   $actual" >&2
            exit 34
          fi

          unzip -t "$SOURCE_ZIP" >/dev/null
          BUILDROOT="$RUNNER_TEMP/privora-build"
          rm -rf "$BUILDROOT"
          mkdir -p "$BUILDROOT/src" "$BUILDROOT/output"
          unzip -q "$SOURCE_ZIP" -d "$BUILDROOT/src"

          test "$(tr -d '\r\n' < "$BUILDROOT/src/VERSION")" = '4.0-rc4'
          test "$(tr -d '\r\n' < "$BUILDROOT/src/prism/VERSION")" = '1.2.1'
          test "$(tr -d '\r\n' < "$BUILDROOT/src/boot/privora-boot-center/VERSION")" = '1.0.0'
          grep -Fq 'Limine 12.5.2' "$BUILDROOT/src/boot/privora-boot-center/CORE-VERSION"
          grep -Fq '5e2d6eb86623fcdcd2a873c9eca7dcafccb34182c17779535fe824fd57b688c5' "$BUILDROOT/src/boot/privora-boot-center/UPSTREAM-SHA256"
          grep -Fq 'privora-boot-center=1.0.0' "$BUILDROOT/src/distro/config/includes.chroot/etc/privora/reconstruction"
          grep -Fq 'boot-core=limine-12.5.2' "$BUILDROOT/src/distro/config/includes.chroot/etc/privora/reconstruction"
          test -x "$BUILDROOT/src/tools/fetch-limine.sh"
          test -x "$BUILDROOT/src/tools/privora-boot-core-build.sh"
          test -f "$BUILDROOT/src/tests/privora-boot-center-test.py"
          test -f "$BUILDROOT/src/release/RC4-PRIVORA-BOOT-CENTER-v33.md"
          test -f "$BUILDROOT/src/release/RC4-PRIVORA-BOOT-CENTER-v33-VALIDATION.txt"

          chmod -R u+rwX "$BUILDROOT/src"
          find "$BUILDROOT/src" -type f -name '*.sh' -exec chmod +x {} +
          echo "BUILDROOT=$BUILDROOT" >> "$GITHUB_ENV"
          echo 'PASS: exact Privora RC4 v33 source selected'

      - name: Start Debian 13 build container
        shell: bash
        run: |
          set -euxo pipefail
          docker pull debian:13
          docker run -d --name privora-builder --privileged \
            -v "$BUILDROOT:/work" \
            debian:13 sleep infinity
          docker exec privora-builder bash -lc 'cat /etc/debian_version; df -h / /work'

      - name: Configure Debian 13 build environment
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cat > /etc/apt/sources.list.d/debian.sources <<'SOURCES'
          Types: deb
          URIs: http://deb.debian.org/debian
          Suites: trixie trixie-updates
          Components: main contrib non-free non-free-firmware
          Architectures: amd64
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: http://deb.debian.org/debian-security
          Suites: trixie-security
          Components: main contrib non-free non-free-firmware
          Architectures: amd64
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          SOURCES

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git make unzip xz-utils live-build debootstrap squashfs-tools xorriso \
            syslinux-common isolinux grub-pc-bin grub-efi-amd64-bin shim-signed \
            dosfstools e2fsprogs btrfs-progs xfsprogs cryptsetup mtools \
            dpkg-dev python3 python3-pil gzip coreutils gcc binutils file sbsigntool
          for tool in curl make gcc ld readelf nm file dpkg-deb dpkg-scanpackages xorriso lb python3; do
            command -v "$tool" >/dev/null || { echo "Missing build tool: $tool" >&2; exit 127; }
          done
          CONTAINER

      - name: Fetch and verify pinned Privora Boot Core
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cd /work/src
          LIMINE_DIR=$(./tools/fetch-limine.sh)
          test -x "$LIMINE_DIR/limine"
          test -s "$LIMINE_DIR/limine-bios.sys"
          test -s "$LIMINE_DIR/limine-bios-cd.bin"
          test -s "$LIMINE_DIR/limine-uefi-cd.bin"
          test -s "$LIMINE_DIR/BOOTX64.EFI"
          echo "PASS: pinned Limine 12.5.2 boot core fetched and checksum verified: $LIMINE_DIR"
          CONTAINER

      - name: Validate RC4 v33 permanent source
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cd /work/src
          ./ci/validate-rc4-unified.sh
          rm -rf release/.deb-work release/debs prism/.build prism/dist
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          CONTAINER

      - name: Build Privora RC4 v33 Boot Center ISO
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cd /work/src/distro
          DESKTOP=privora EDITION=standard INSTALLER=1 OFFLINE_REPO=1 PERSISTENCE=auto PRIVORA_BOOT_CORE=limine ./build.sh
          ISO=$(find . -maxdepth 1 -type f -name 'Privora-4.0-rc4-Installer-privora-standard-amd64.iso' -print -quit)
          test -n "$ISO"
          test -s "$ISO"
          mv "$ISO" /work/output/
          if [ -f "$ISO.sha256" ]; then mv "$ISO.sha256" /work/output/; fi
          cd /work/output
          sha256sum Privora-4.0-rc4-Installer-privora-standard-amd64.iso > SHA256SUMS.txt
          cp /work/src/RECONSTRUCTION-PROVENANCE.md .
          cp /work/src/release/RC4-PRIVORA-BOOT-CENTER-v33-VALIDATION.txt .
          cd /work/src/distro
          lb clean --purge || true
          rm -rf chroot binary cache .build || true
          CONTAINER

      - name: Preserve ISO immediately after successful build
        uses: actions/upload-artifact@v6
        with:
          name: Privora-4.0-RC4-v33-Boot-Center-ISO-Candidate-Uncertified
          path: ${{ runner.temp }}/privora-build/output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Verify finished RC4 v33 Privora Boot Center ISO
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          ISO=/work/output/Privora-4.0-rc4-Installer-privora-standard-amd64.iso
          test -s "$ISO"
          check=$(mktemp -d)
          trap 'rm -rf "$check"' EXIT

          for path in \
            /live/vmlinuz \
            /live/initrd.img \
            /live/filesystem.squashfs \
            /boot/limine/limine.conf \
            /boot/limine/limine-bios.sys \
            /boot/limine/limine-bios-cd.bin \
            /boot/limine/limine-uefi-cd.bin \
            /EFI/BOOT/BOOTX64.EFI \
            /boot/privora/boot-center.png \
            /boot/privora/BOOT-CORE-STATUS.txt; do
            found=$(xorriso -indev "$ISO" -find "$path" -type f -- 2>/dev/null || true)
            grep -Fq "$path" <<<"$found"
          done

          xorriso -osirrox on -indev "$ISO" -extract /boot/limine/limine.conf "$check/limine.conf" >/dev/null 2>&1
          echo '--- finished ISO Privora Boot Center 1.0 ---'
          cat "$check/limine.conf"
          echo '--- end Boot Center config ---'
          grep -Fq 'timeout: 30' "$check/limine.conf"
          grep -Fq 'default_entry: Try Privora Live' "$check/limine.conf"
          grep -Fq 'graphics: yes' "$check/limine.conf"
          grep -Fq 'mouse: yes' "$check/limine.conf"
          grep -Fq 'interface_resolution: 1280x720' "$check/limine.conf"
          grep -Fq 'BOOT CENTER 1.0' "$check/limine.conf"
          grep -Fq 'term_font_scale: 2x2' "$check/limine.conf"
          grep -Fq '/ Install Privora' "$check/limine.conf"
          grep -Fq '/ Try Privora Live' "$check/limine.conf"
          grep -Fq '/ Privora Recovery & Repair' "$check/limine.conf"
          grep -Fq '/ Privora Terminal / Console' "$check/limine.conf"
          grep -Fq '/ Advanced Options' "$check/limine.conf"
          grep -Fq '// Install Privora - Compatibility Mode' "$check/limine.conf"
          grep -Fq '// Try Privora with Persistence' "$check/limine.conf"
          grep -Fq '// Privora Safe Graphics' "$check/limine.conf"
          grep -Fq '// Privora Accessibility' "$check/limine.conf"
          grep -Fq 'privora.mode=recovery privora.recovery=1' "$check/limine.conf"
          grep -Fq 'privora.mode=console systemd.unit=multi-user.target' "$check/limine.conf"
          grep -Fq 'plymouth.enable=0' "$check/limine.conf"
          console_line=$(grep '^cmdline: .*privora.mode=console' "$check/limine.conf")
          ! grep -Fq ' quiet ' <<<" $console_line "
          ! grep -Fq ' splash ' <<<" $console_line "

          xorriso -osirrox on -indev "$ISO" -extract /boot/privora/boot-center.png "$check/boot-center.png" >/dev/null 2>&1
          file "$check/boot-center.png" | grep -Fq 'PNG image data, 1920 x 1080'
          xorriso -osirrox on -indev "$ISO" -extract /EFI/BOOT/BOOTX64.EFI "$check/BOOTX64.EFI" >/dev/null 2>&1
          file "$check/BOOTX64.EFI" | grep -Ei 'PE32\+|EFI application'
          xorriso -osirrox on -indev "$ISO" -extract /boot/privora/BOOT-CORE-STATUS.txt "$check/boot-core-status.txt" >/dev/null 2>&1
          grep -Fq 'privora-boot-center=1.0.0' "$check/boot-core-status.txt"
          grep -Fq 'boot-core=limine-12.5.2' "$check/boot-core-status.txt"
          grep -Fq 'secure-boot=unsigned-development' "$check/boot-core-status.txt"

          xorriso -osirrox on -indev "$ISO" -extract /live/filesystem.squashfs "$check/filesystem.squashfs" >/dev/null 2>&1
          unsquashfs -ll "$check/filesystem.squashfs" > "$check/squashfs-listing.txt"
          for path in \
            usr/bin/privora-prism-mode-dispatch \
            usr/bin/privora-prism-panel-ensure \
            usr/lib/privora/privora-live-account-prepare \
            usr/lib/systemd/system-generators/privora-console-generator \
            usr/share/sddm/faces/privora.face.icon \
            usr/share/privora/boot-center/VERSION \
            usr/share/privora/boot-center/limine.conf; do
            grep -Fq "$path" "$check/squashfs-listing.txt"
          done
          unsquashfs -cat "$check/filesystem.squashfs" usr/share/privora/boot-center/VERSION | grep -Fxq '1.0.0'
          unsquashfs -cat "$check/filesystem.squashfs" etc/privora/reconstruction > "$check/reconstruction.txt"
          grep -Fq 'privora-boot-center=1.0.0' "$check/reconstruction.txt"
          grep -Fq 'boot-core=limine-12.5.2' "$check/reconstruction.txt"
          grep -Fq 'futuristic-boot-distinct-modes=v32' "$check/reconstruction.txt"

          xorriso -indev "$ISO" -report_el_torito plain | tee "$check/el-torito.txt"
          xorriso -indev "$ISO" -report_system_area plain | tee "$check/system-area.txt"
          grep -Fq 'BIOS' "$check/el-torito.txt"
          grep -Eq 'UEFI|EFI' "$check/el-torito.txt"
          grep -Eq 'MBR|Protective' "$check/system-area.txt"
          echo 'PASS: final ISO uses Privora Boot Center 1.0 / Limine as the BIOS+UEFI media boot core'
          CONTAINER

      - name: Install QEMU certification tools
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf socat
          apt-get clean
          rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/*
          CONTAINER

      - name: Capture Privora Boot Center 1.0 visual evidence
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          ISO=/work/output/Privora-4.0-rc4-Installer-privora-standard-amd64.iso
          MON=/tmp/privora-v33-monitor.sock
          PPM=/work/output/PRIVORA-BOOT-CENTER-v33.ppm
          PNG=/work/output/PRIVORA-BOOT-CENTER-v33.png
          rm -f "$MON" "$PPM" "$PNG"

          qemu-system-x86_64 \
            -machine q35,accel=tcg -m 2048 -smp 2 -cpu max \
            -vga std -display none -serial none -no-reboot -net none \
            -monitor "unix:$MON,server=on,wait=off" \
            -drive "if=none,id=privora_live,format=raw,readonly=on,file=$ISO" \
            -device "virtio-blk-pci,drive=privora_live,bootindex=1" \
            >/tmp/privora-v33-qemu.out 2>/tmp/privora-v33-qemu.err &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -f "$MON"' EXIT

          for _ in $(seq 1 30); do [ -S "$MON" ] && break; sleep 0.2; done
          test -S "$MON"
          sleep 6
          printf 'screendump %s\n' "$PPM" | socat - UNIX-CONNECT:"$MON"
          for _ in $(seq 1 20); do [ -s "$PPM" ] && break; sleep 0.2; done
          test -s "$PPM"

          python3 - "$PPM" "$PNG" <<'PY'
          from PIL import Image, ImageStat
          import sys
          src,dst=sys.argv[1:]
          im=Image.open(src).convert('RGB')
          dynamic=max(hi-lo for lo,hi in im.getextrema())
          if im.width < 640 or im.height < 400 or dynamic < 24:
              raise SystemExit(f'Boot Center screenshot lacks expected visual signal: size={im.size} dynamic={dynamic}')
          im.save(dst)
          print(f'PASS: Privora Boot Center screenshot captured size={im.size} dynamic={dynamic}')
          PY
          rm -f "$PPM"
          CONTAINER

      - name: Upload Privora Boot Center visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Privora-4.0-RC4-v33-Boot-Center-Visual-Evidence
          path: ${{ runner.temp }}/privora-build/output/PRIVORA-BOOT-CENTER-v33.png
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Certify BIOS, UEFI, and disposable installation
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cd /work/src
          ISO=/work/output/Privora-4.0-rc4-Installer-privora-standard-amd64.iso

          QEMU_TIMEOUT=600 ./ci/qemu-live-smoke.sh "$ISO" bios
          QEMU_TIMEOUT=600 ./ci/qemu-live-smoke.sh "$ISO" uefi
          QEMU_TIMEOUT=1200 ./installer/vm/run-install-core-certification.sh "$ISO"

          cat > /work/output/CERTIFICATION.txt <<'EOF'
          Privora 4.0 RC4 v33 — Privora Boot Center 1.0 & Modern Boot Core
          Privora Prism Environment 1.2.1
          Boot core: Limine 12.5.2

          Source identity: VERIFIED
          Boot Center payload: VERIFIED
          BIOS Limine ISO-hybrid live boot: PASS
          UEFI Limine ISO-hybrid live boot: PASS
          Disposable UEFI install/write: PASS
          Installed-system boot marker: PASS
          Production Secure Boot trust chain: NOT CERTIFIED BY THIS WORKFLOW
          EOF
          CONTAINER

      - name: Add Windows USB instructions
        if: success()
        shell: bash
        run: |
          cat > "$BUILDROOT/output/FLASH-TO-USB-WINDOWS.txt" <<'EOF'
          Privora 4.0 RC4 v33 — Privora Boot Center 1.0 — Privora Prism 1.2.1

          1. Verify the ISO against SHA256SUMS.txt.
          2. Open Rufus on Windows.
          3. Select Privora-4.0-rc4-Installer-privora-standard-amd64.iso.
          4. Write the image to the USB drive; the selected USB is erased.
          5. Boot the computer from that USB.
          6. Privora Boot Center 1.0 is the primary BIOS/UEFI startup interface.
          7. Use keyboard or pointer navigation when supported by firmware.
          8. First-level choices are Install Privora, Try Privora Live, Recovery & Repair, Terminal / Console, and Advanced Options.
          9. Advanced Options contains Compatibility Install, Persistence, Safe Graphics and Accessibility.
          10. Try Privora Live is the 30-second default.
          11. Console mode intentionally shows verbose kernel/systemd startup with no Plymouth splash.
          12. Live normally autologs into Prism; fallback credentials are user `privora`, password `live`.
          13. This development image does not claim production Secure Boot certification.
          EOF

      - name: Upload certified Privora RC4 v33 ISO
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Privora-4.0-RC4-v33-Certified-Boot-Center-1.0-Prism-1.2.1-amd64
          path: ${{ runner.temp }}/privora-build/output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Stop build container
        if: always()
        shell: bash
        run: docker rm -f privora-builder >/dev/null 2>&1 || true
