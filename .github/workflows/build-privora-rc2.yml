        QEMU_TIMEOUT=600 ./ci/qemu-live-smoke.sh "$ISO" bios
        QEMU_TIMEOUT=600 ./ci/qemu-live-smoke.sh "$ISO" uefi

        QEMU_MODE_TIMEOUT=420 ./ci/qemu-mode-smoke.sh "$ISO" live PRIVORA_PRISM_READY
        QEMU_MODE_SCREENSHOT=/work/output/PRIVORA-INSTALLER-v39-REV3.png \
