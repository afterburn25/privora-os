          Boot core: Limine 12.5.2

          v34 Limine C-toolchain preflight: PASS
          v35 end-to-end mode certification foundation: PRESENT
          v36 installed Boot Center / Secure Boot groundwork: PRESENT
          v37 consolidated regression recovery: PRESENT
          v38 Boot Center / startup-progress / installer recovery: PASS
          v39 hardware readiness service/payload: PASS
          v39 Rev2 regression/source audit: PASS
          v39 Rev3 systemd build-context hotfix: PASS
          GTK mapped-frame installer readiness contract: PASS
          Install framebuffer non-black visual gate: PASS
          Finished ISO Boot Center payload: PASS
          BIOS Limine ISO-hybrid live boot: PASS
          UEFI Limine ISO-hybrid live boot: PASS
          Live Prism mode marker: PASS
          Install mode / mapped-frame installer marker: PASS
          Recovery mode marker: PASS
          Console mode marker: PASS
          Disposable install/write: PASS
          Installed-system boot marker: PASS
          GRUB installed-system fallback: PRESERVED
          Production Secure Boot trust/integrity chain: NOT CERTIFIED
          EOF
          CONTAINER


      - name: Upload Privora installer visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Privora-4.0-RC4-v39-Rev3-Installer-Visual-Evidence-Resumed
          path: ${{ runner.temp }}/privora-v39-rev3-resume/output/PRIVORA-INSTALLER-v39-REV3.png
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 6

      - name: Record resume diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          BUILDROOT="${BUILDROOT:-$RUNNER_TEMP/privora-v39-rev3-resume}"
          mkdir -p "$BUILDROOT/output" "$BUILDROOT/logs"
          {
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "job_status=${{ job.status }}"
            echo 'output_inventory:'
            find "$BUILDROOT/output" -maxdepth 2 -type f -printf '  %p %s bytes\n' | sort
            echo 'log_inventory:'
            find "$BUILDROOT/logs" -maxdepth 2 -type f -printf '  %p %s bytes\n' | sort
          } >> "$BUILDROOT/output/RESUME-STATUS.txt"

      - name: Upload resumed v39 Rev3 certification results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Privora-4.0-RC4-v39-Rev3-Existing-ISO-Certification-Results
          path: ${{ runner.temp }}/privora-v39-rev3-resume/output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Stop certification container
        if: always()
        shell: bash
        run: docker rm -f privora-certifier >/dev/null 2>&1 || true
