        ./ci/qemu-mode-smoke.sh "$ISO" install PRIVORA_INSTALLER_READY
        QEMU_MODE_TIMEOUT=360 ./ci/qemu-mode-smoke.sh "$ISO" recovery PRIVORA_RECOVERY_READY
        QEMU_MODE_TIMEOUT=240 ./ci/qemu-mode-smoke.sh "$ISO" console PRIVORA_CONSOLE_READY

        QEMU_TIMEOUT=1200 ./installer/vm/run-install-core-certification.sh "$ISO"

        cat > /work/output/CERTIFICATION-v39-REV3.txt <<'EOF'
        Privora 4.0 RC4 v39 Rev3 — systemd Build-Context Hotfix
        Privora Boot Center 1.2
        Privora Prism Environment 1.3.1
        Boot core: Limine 12.5.2

        v34 Limine C-toolchain preflight: PASS
        v35 end-to-end mode certification foundation: PRESENT
        v36 installed Boot Center / Secure Boot groundwork: PRESENT
        v37 consolidated regression recovery: PRESENT
        v38 Boot Center / startup-progress / installer recovery: PASS
        v39 hardware readiness service/payload: PASS
        v39 Rev2 regression/source audit: PASS
        v39 Rev3 systemd build-context hotfix: PASS
        GTK mapped-frame installer readiness contract: PASS
        Install framebuffer non-black visual gate: PASS
        Finished ISO Boot Center payload: PASS
        BIOS Limine ISO-hybrid live boot: PASS
        UEFI Limine ISO-hybrid live boot: PASS
        Live Prism mode marker: PASS
        Install mode / mapped-frame installer marker: PASS
        Recovery mode marker: PASS
        Console mode marker: PASS
        Disposable install/write: PASS
        Installed-system boot marker: PASS
        GRUB installed-system fallback: PRESERVED
        Production Secure Boot trust/integrity chain: NOT CERTIFIED
        EOF
        CONTAINER

    - name: Bind certification to immutable candidate
      if: always()
      shell: bash
      run: "if [ -f \"$BUILDROOT/output/CERTIFICATION-v39-REV3.txt\" ] && [ ! -f \"$BUILDROOT/output/CERTIFICATION-v39-REV5.txt\" ]; then\n  cp \"$BUILDROOT/output/CERTIFICATION-v39-REV3.txt\" \"$BUILDROOT/output/CERTIFICATION-v39-REV5.txt\"\nfi\nset +e\nSTATUS=\"$BUILDROOT/output/CERTIFICATION-STATUS-v39-REV5.txt\"\nmkdir -p \"$BUILDROOT/output\"\ntouch \"$STATUS\"\n{\n  echo \"finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\n  echo \"job_status=${{ job.status }}\"\n  echo \"candidate_artifact_id=${{ needs.build_iso.outputs.candidate_id }}\"\n  echo \"candidate_artifact_digest=${{ needs.build_iso.outputs.candidate_digest }}\"\n  echo \"candidate_artifact_url=${{ needs.build_iso.outputs.candidate_url }}\"\n} >> \"$STATUS\"\n\nif [ -f \"$BUILDROOT/output/CERTIFICATION-v39-REV5.txt\" ]; then\n  {\n    echo\n    echo \"Immutable GitHub candidate:\"\n    echo \"Artifact ID: ${{ needs.build_iso.outputs.candidate_id }}\"\n    echo \"Artifact digest: ${{ needs.build_iso.outputs.candidate_digest }}\"\n    echo \"Artifact URL: ${{ needs.build_iso.outputs.candidate_url }}\"\n  } >> \"$BUILDROOT/output/CERTIFICATION-v39-REV5.txt\"\nfi\n"
    - name: Add Windows USB instructions
      if: success()
      shell: bash
      run: |
        cat > "$BUILDROOT/output/FLASH-TO-USB-WINDOWS.txt" <<'EOF'
        Privora 4.0 RC4 v39 Rev3 — systemd Build-Context Hotfix — Prism 1.3.1

        1. Verify the ISO against SHA256SUMS.txt.
        2. Open Rufus on Windows and select Privora-4.0-rc4-Installer-privora-standard-amd64.iso.
        3. Write the image to the USB drive; the selected USB is erased.
        4. Boot the computer from the USB.
        5. Privora Boot Center 1.2 is the primary BIOS/UEFI startup interface.
        6. The selector is deliberately enlarged and positioned inside the central graphical panel.
        7. Try Privora Live is the 30-second default.
        8. Install, Live, Recovery and Terminal/Console are independently certified boot modes.
        9. Console mode intentionally disables Plymouth and keeps verbose kernel/systemd output visible into the prompt.
        10. Live normally autologs into Privora Prism; fallback Live credentials are user `privora`, password `live`.
        11. Startup uses the Privora splash WITH the progress bar and completes it at graphical handoff.
        12. Restart/shutdown use the same Privora artwork WITHOUT the boot progress bar.
        13. Prism 1.3.1 uses the Privora P on the native application launcher; ordinary first-party apps use distinct icons.
        14. v36 stages installed Privora Boot Center on UEFI while retaining GRUB as a recovery fallback.
        15. Privora Hardware Readiness scans devices locally and uploads nothing.
        16. Firmware/driver pages are informational by default and do not silently flash firmware or replace a working driver.
        17. This development image does not claim production Secure Boot certification.
        EOF

    - name: Upload certification reports and visual evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Privora-4.0-RC4-v39-Rev5-Certification-Evidence
