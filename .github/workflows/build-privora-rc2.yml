name: Build Privora 4.0 RC2 Installer ISO

on:
  workflow_dispatch:

jobs:
  installer-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space before build
        shell: bash
        run: |
          set -euxo pipefail
          echo 'Disk before cleanup:'
          df -h /

          # ubuntu-latest includes large SDK stacks that this Linux ISO build does not use.
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          docker image prune -af || true

          echo 'Disk after cleanup:'
          df -h /

      - name: Locate and unpack Privora RC2 source
        shell: bash
        run: |
          set -euxo pipefail
          echo 'Repository files after checkout:'
          find . -maxdepth 4 -type f -printf '%p\n' | sort | sed -n '1,250p'

          SOURCE_ZIP=''
          if [ -f ./Privora-4.0-RC2-Web-Source.zip ]; then
            SOURCE_ZIP=./Privora-4.0-RC2-Web-Source.zip
          else
            SOURCE_ZIP="$(find . -type f \
              \( -iname 'Privora-4.0-RC2-Web-Source*.zip' -o -iname '*Privora*RC2*Source*.zip' \) \
              -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          fi

          if [ -z "$SOURCE_ZIP" ] || [ ! -f "$SOURCE_ZIP" ]; then
            echo 'ERROR: No Privora RC2 source ZIP was found in the repository.' >&2
            exit 1
          fi

          echo "Using Privora source archive: $SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP" >/dev/null

          BUILDROOT="$RUNNER_TEMP/privora-build"
          rm -rf "$BUILDROOT"
          mkdir -p "$BUILDROOT/src" "$BUILDROOT/output"
          unzip -q "$SOURCE_ZIP" -d "$BUILDROOT/src"

          if [ ! -f "$BUILDROOT/src/VERSION" ]; then
            VERSION_FILE="$(find "$BUILDROOT/src" -mindepth 2 -maxdepth 3 -type f -name VERSION -print -quit)"
            if [ -n "$VERSION_FILE" ]; then
              SOURCE_ROOT="$(dirname "$VERSION_FILE")"
              mkdir -p "$BUILDROOT/flat"
              cp -a "$SOURCE_ROOT"/. "$BUILDROOT/flat"/
              rm -rf "$BUILDROOT/src"
              mv "$BUILDROOT/flat" "$BUILDROOT/src"
            fi
          fi

          test -f "$BUILDROOT/src/VERSION"
          test "$(tr -d '\r\n' < "$BUILDROOT/src/VERSION")" = '4.0-rc2'
          chmod -R u+rwX "$BUILDROOT/src"
          find "$BUILDROOT/src" -type f -name '*.sh' -exec chmod +x {} +
          echo "BUILDROOT=$BUILDROOT" >> "$GITHUB_ENV"
          df -h /

      - name: Start Debian 13 Privora build container
        shell: bash
        run: |
          set -euxo pipefail
          docker pull debian:13
          docker run -d --name privora-builder --privileged \
            -v "$BUILDROOT:/work" \
            debian:13 sleep infinity
          docker exec privora-builder bash -lc 'cat /etc/debian_version; df -h / /work'

      - name: Configure Debian 13 build environment
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cat > /etc/apt/sources.list.d/debian.sources <<'SOURCES'
          Types: deb
          URIs: http://deb.debian.org/debian
          Suites: trixie trixie-updates
          Components: main contrib non-free non-free-firmware
          Architectures: amd64
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: http://deb.debian.org/debian-security
          Suites: trixie-security
          Components: main contrib non-free non-free-firmware
          Architectures: amd64
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          SOURCES
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates unzip live-build debootstrap squashfs-tools xorriso \
            syslinux-common isolinux grub-pc-bin grub-efi-amd64-bin shim-signed \
            dosfstools e2fsprogs btrfs-progs xfsprogs cryptsetup mtools \
            dpkg-dev python3 gzip coreutils gcc binutils file

          # ci/validate.sh builds the PrivoraKernel research target as a source-integrity gate.
          # Keep the toolchain explicit so the minimal Debian container fails early and clearly.
          for tool in gcc ld readelf nm file; do
            command -v "$tool" >/dev/null || { echo "ERROR: required validation tool missing: $tool" >&2; exit 127; }
          done
          gcc --version | head -n1
          ld --version | head -n1

          apt-get clean
          rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/*
          df -h / /work
          CONTAINER

      - name: Apply RC2 compatibility and disk-footprint fixes
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cd /work/src
          python3 - <<'PYFIX'
          from pathlib import Path

          # Debian 13 PolicyKit package split.
          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text()
              except Exception:
                  continue
              if 'policykit-1' in text:
                  path.write_text(text.replace('policykit-1', 'polkitd pkexec'))

          # Co-installable BIOS/UEFI GRUB module packages for the live environment.
          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text()
              except Exception:
                  continue
              new = text.replace('grub-efi-amd64 grub-pc', 'grub-efi-amd64-bin grub-pc-bin grub2-common')
              new = new.replace('grub-pc grub-efi-amd64', 'grub-pc-bin grub-efi-amd64-bin grub2-common')
              if new != text:
                  path.write_text(new)

          # privora-platform is canonical owner of these backend helper commands.
          deb_builder = Path('tools/build-first-party-debs.py')
          bs = deb_builder.read_text()
          old_backend = "    'privora-oem','privora-cloud','privora-connect','privora-ai','privora-apply-branding'\n"
          new_backend = "    'privora-oem','privora-cloud','privora-connect','privora-ai','privora-apply-branding',\n    'privora-hardware-compat','privora-update-rollback-plan'\n"
          if old_backend in bs:
              deb_builder.write_text(bs.replace(old_backend, new_backend, 1))

          # Plasma + Standard dependencies already live inside filesystem.squashfs.
          # The selected-profile offline repository therefore only needs the two
          # Privora metapackages instead of duplicating their entire Debian closure.
          repo = Path('tools/build-offline-installer-repo.sh')
          repo.write_text("""#!/usr/bin/env bash
          set -euo pipefail
          root=$(cd \"$(dirname \"$0\")/..\" && pwd)
          out=\"$root/distro/config/includes.binary/privora-repo\"
          desktop=${DESKTOP:-plasma}
          edition=${EDITION:-standard}
          rm -rf \"$out\"
          mkdir -p \"$out/pool\"
          command -v dpkg-scanpackages >/dev/null || { echo 'dpkg-scanpackages required' >&2; exit 127; }
          \"$root/tools/build-first-party-debs.py\" >/dev/null
          cp \"$root\"/release/debs/privora-desktop-${desktop}_*.deb \"$out/pool/\"
          cp \"$root\"/release/debs/privora-edition-${edition}_*.deb \"$out/pool/\"
          (
            cd \"$out\"
            dpkg-scanpackages pool /dev/null > Packages
            gzip -9c Packages > Packages.gz
            sha256sum Packages Packages.gz > SHA256SUMS
          )
          printf '%s\\n' \\
            'Privora 4.0 RC2 selected-profile offline repository.' \\
            'Plasma + Standard dependencies are already present in the copied live filesystem.' \\
            > \"$out/README.txt\"
          printf 'Offline installer repository: %s packages\\n' \"$(find \"$out/pool\" -type f -name '*.deb' | wc -l)\"
          """)

          # During profile activation, use only the on-media repository. Dependencies
          # are already installed in the copied Plasma + Standard live filesystem.
          engine = Path('installer/live/privora-install-engine')
          es = engine.read_text()
          old = "    cmd(['apt-get','update','-o','Acquire::Languages=none'],chroot=True)\n    cmd(['apt-get','install','-y','--no-install-recommends',f'privora-desktop-{desktop}',f'privora-edition-{edition}'],chroot=True)\n"
          new = "    offline_opts=['-o','Dir::Etc::sourcelist=/etc/apt/sources.list.d/privora-offline.list','-o','Dir::Etc::sourceparts=-','-o','Acquire::Languages=none']\n    cmd(['apt-get','update']+offline_opts,chroot=True)\n    cmd(['apt-get','install','-y','--no-install-recommends']+offline_opts+[f'privora-desktop-{desktop}',f'privora-edition-{edition}'],chroot=True)\n"
          if old in es:
              es = es.replace(old, new, 1)
          anchor = "    emit('packages',72,f'Installing {desktop} desktop and {edition} application profile')\n"
          if "dpkg','--add-architecture','i386" not in es and anchor in es:
              es = es.replace(anchor, anchor + "    if edition=='gaming': cmd(['dpkg','--add-architecture','i386'],chroot=True)\n", 1)
          engine.write_text(es)

          # Keep APT indexes out of the final live filesystem and explicitly select xz.
          auto = Path('distro/auto/config')
          a = auto.read_text()
          needle = '  --apt-secure true \\\n'
          if '--apt-indices false' not in a and needle in a:
              a = a.replace(needle, needle + '  --apt-indices false \\\n  --chroot-squashfs-compression-type xz \\\n', 1)
          auto.write_text(a)

          # Late cleanup runs inside the chroot before SquashFS generation.
          hook = Path('distro/config/hooks/live/0999-privora-build-cleanup.hook.chroot')
          hook.write_text("""#!/bin/sh
          set -eu
          apt-get clean || true
          rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/* /tmp/* /var/tmp/*
          find /var/log -type f -exec truncate -s 0 {} \\; 2>/dev/null || true
          """)

          # Avoid creating a second full-size copy of the finished ISO.
          build = Path('distro/build.sh')
          b = build.read_text()
          old_copy = '  cp --reflink=auto "$image" "$out" 2>/dev/null || cp "$image" "$out"\n'
          if old_copy in b:
              b = b.replace(old_copy, '  mv "$image" "$out"\n', 1)
          build.write_text(b)
          PYFIX

          chmod +x tools/build-offline-installer-repo.sh \
                   installer/live/privora-install-engine \
                   distro/config/hooks/live/0999-privora-build-cleanup.hook.chroot
          bash -n tools/build-offline-installer-repo.sh
          bash -n distro/build.sh
          bash -n distro/auto/config
          CONTAINER

      - name: Validate Privora source and first-party package ownership
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cd /work/src
          ./ci/validate.sh
          ./tools/build-first-party-debs.py
          python3 - <<'PYOWN'
          from pathlib import Path
          import itertools, subprocess
          packages = {}
          for deb in sorted(Path('release/debs').glob('*.deb')):
              out = subprocess.check_output(['dpkg-deb','-c',str(deb)], text=True)
              files = set()
              for line in out.splitlines():
                  parts = line.split()
                  if not parts or parts[0].startswith('d'):
                      continue
                  path = parts[-1]
                  if path.startswith('./'):
                      path='/' + path[2:]
                  files.add(path)
              packages[deb.name]=files
          collisions=[]
          for a,b in itertools.combinations(sorted(packages),2):
              for path in sorted(packages[a] & packages[b]):
                  collisions.append((a,b,path))
          if collisions:
              for row in collisions:
                  print('COLLISION:', *row)
              raise SystemExit(1)
          print(f'PASS: no file ownership collisions across {len(packages)} Privora packages')
          PYOWN
          df -h / /work
          CONTAINER

      - name: Build installer-first ISO
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cd /work/src
          echo 'Disk immediately before live-build:'
          df -h / /work
          du -sh . distro/config/includes.binary 2>/dev/null || true
          INSTALLER=1 \
          OFFLINE_REPO=1 \
          PERSISTENCE=1 \
          DESKTOP=plasma \
          EDITION=standard \
          ARCHITECTURE=amd64 \
          ./ci/build-live-iso.sh
          echo 'Disk immediately after live-build:'
          df -h / /work
          du -sh distro/chroot distro/config/includes.binary/privora-repo 2>/dev/null || true
          CONTAINER

      - name: Preserve ISO and reclaim live-build workspace
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cd /work/src
          iso=$(find distro -maxdepth 1 -type f -name 'Privora-4.0-rc2-Installer-*.iso' -print -quit)
          test -n "$iso"
          ./tools/iso-preflight.py "$iso"
          mkdir -p /work/output
          mv "$iso" /work/output/
          sha256sum /work/output/*.iso > /work/output/SHA256SUMS.txt
          (cd distro && lb clean --purge) || true
          rm -rf distro/chroot distro/binary distro/cache distro/.build \
                 distro/config/includes.binary/privora-repo release/.offline-repo-work
          apt-get clean || true
          rm -rf /var/cache/apt/archives/* /tmp/* /var/tmp/* || true
          df -h / /work
          CONTAINER

      - name: Install QEMU and certify BIOS, UEFI, and installation
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cat > /etc/apt/sources.list.d/debian.sources <<'SOURCES'
          Types: deb
          URIs: http://deb.debian.org/debian
          Suites: trixie trixie-updates
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: http://deb.debian.org/debian-security
          Suites: trixie-security
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          SOURCES
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf
          apt-get clean
          rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          cd /work/src
          ISO=$(find /work/output -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$ISO"
          QEMU_TIMEOUT=420 ./ci/qemu-live-smoke.sh "$ISO" bios
          QEMU_TIMEOUT=420 ./ci/qemu-live-smoke.sh "$ISO" uefi
          QEMU_TIMEOUT=1200 ./installer/vm/run-install-core-certification.sh "$ISO"
          CONTAINER

      - name: Prepare download instructions
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$BUILDROOT/output/FLASH-TO-USB-WINDOWS.txt" <<'TXT'
          PRIVORA 4.0 RC2 - WINDOWS USB FLASHING

          1. Back up anything on the target USB; it will be erased.
          2. Open Rufus.
          3. Select the Privora RC2 ISO.
          4. For a modern PC use GPT + UEFI.
          5. Write the image and reboot.
          6. Select the UEFI USB entry from your PC's boot menu.
          7. Privora boots into the Prism installer-first environment.

          Back up your computer before installing. If Windows uses BitLocker,
          keep your recovery key available before changing disk partitions.
          TXT
          ls -lh "$BUILDROOT/output"
          df -h /

      - name: Upload Privora RC2 ISO
        uses: actions/upload-artifact@v4
        with:
          name: Privora-4.0-RC2-Installer-Plasma-Standard-amd64
          path: ${{ runner.temp }}/privora-build/output/
          if-no-files-found: error
          retention-days: 14

      - name: Stop build container
        if: always()
        shell: bash
        run: docker rm -f privora-builder 2>/dev/null || true
