name: Privora 4.0 RC3 — Reuse v21 ISO — BIOS/UEFI Diagnostic Certification v23

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify-existing-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CANDIDATE_ARTIFACT: Privora-4.0-RC3-v21-BIOS-Recovery-ISO-Candidate-Uncertified
      ISO_NAME: Privora-4.0-rc3-Installer-privora-standard-amd64.iso

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Locate newest v21 ISO candidate artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          API="/repos/${GITHUB_REPOSITORY}/actions/artifacts"
          RESPONSE="$RUNNER_TEMP/privora-artifacts.json"

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$API" \
            -f "name=$CANDIDATE_ARTIFACT" \
            -f "per_page=100" \
            > "$RESPONSE"

          python3 - "$RESPONSE" "$CANDIDATE_ARTIFACT" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path

          response, wanted, output = sys.argv[1:]
          data = json.loads(Path(response).read_text())
          candidates = [
              a for a in data.get("artifacts", [])
              if a.get("name") == wanted and not a.get("expired", False)
          ]
          if not candidates:
              raise SystemExit(
                  f"ERROR: no non-expired GitHub Actions artifact named {wanted!r} was found"
              )

          candidates.sort(key=lambda a: (a.get("created_at", ""), int(a.get("id", 0))))
          a = candidates[-1]

          print("Selected artifact:")
          print("  id:", a["id"])
          print("  name:", a["name"])
          print("  created_at:", a.get("created_at"))
          print("  expires_at:", a.get("expires_at"))
          print("  size_in_bytes:", a.get("size_in_bytes"))
          print("  digest:", a.get("digest"))
          print("  workflow_run:", (a.get("workflow_run") or {}).get("id"))

          with open(output, "a", encoding="utf-8") as f:
              f.write(f"artifact_id={a['id']}\n")
              f.write(f"artifact_digest={a.get('digest','')}\n")
              f.write(f"source_run_id={(a.get('workflow_run') or {}).get('id','')}\n")
          PY

      - name: Download and normalize v21 ISO candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euxo pipefail

          BUILDROOT="$RUNNER_TEMP/privora-v23"
          mkdir -p "$BUILDROOT/download" "$BUILDROOT/output" "$BUILDROOT/logs"
          echo "BUILDROOT=$BUILDROOT" >> "$GITHUB_ENV"

          ARCHIVE="$BUILDROOT/download/v21-candidate-artifact.zip"

          curl -L --fail --retry 3 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$ARCHIVE"

          unzip -t "$ARCHIVE"
          mkdir -p "$BUILDROOT/download/unpacked"
          unzip -q "$ARCHIVE" -d "$BUILDROOT/download/unpacked"

          echo 'Downloaded artifact contents:'
          find "$BUILDROOT/download/unpacked" -maxdepth 4 -type f -printf '%s %p\n' | sort

          ISO=$(find "$BUILDROOT/download/unpacked" -type f -name "$ISO_NAME" -print -quit)
          if [ -z "$ISO" ]; then
            ISO=$(find "$BUILDROOT/download/unpacked" -type f -iname '*.iso' -print -quit)
          fi

          if [ -z "$ISO" ] || [ ! -s "$ISO" ]; then
            echo "ERROR: downloaded artifact does not contain a non-empty ISO." >&2
            exit 3
          fi

          cp "$ISO" "$BUILDROOT/output/$ISO_NAME"
          sha256sum "$BUILDROOT/output/$ISO_NAME" | tee "$BUILDROOT/output/REUSED-ISO-SHA256.txt"
          echo "ISO=$BUILDROOT/output/$ISO_NAME" >> "$GITHUB_ENV"

      - name: Install QEMU and ISO inspection tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xorriso unzip
          sudo apt-get clean
          df -h /

      - name: Inspect reused ISO before boot
        shell: bash
        run: |
          set -euxo pipefail

          test -s "$ISO"

          xorriso -indev "$ISO" -ls /live | tee "$BUILDROOT/logs/iso-live-tree.txt"
          xorriso -indev "$ISO" -report_el_torito plain \
            | tee "$BUILDROOT/logs/iso-el-torito.txt" || true
          xorriso -indev "$ISO" -report_system_area plain \
            | tee "$BUILDROOT/logs/iso-system-area.txt" || true

          for path in /live/vmlinuz /live/initrd.img /live/filesystem.squashfs; do
            xorriso -indev "$ISO" -find "$path" -type f -- | grep -Fq "$path"
          done

          for path in \
            /isolinux/isolinux.bin \
            /isolinux/vesamenu.c32 \
            /isolinux/ldlinux.c32 \
            /isolinux/libcom32.c32 \
            /isolinux/libutil.c32; do
            xorriso -indev "$ISO" -find "$path" -type f -- | grep -Fq "$path"
          done

          mkdir -p "$BUILDROOT/logs/iso-files"
          xorriso -osirrox on -indev "$ISO" \
            -extract /isolinux/isolinux.cfg "$BUILDROOT/logs/iso-files/isolinux.cfg" \
            >/dev/null 2>&1
          cat "$BUILDROOT/logs/iso-files/isolinux.cfg"

      - name: Create standalone v23 QEMU diagnostic harness
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$BUILDROOT/tools"

          cat > "$BUILDROOT/tools/qemu-live-diagnostic.sh" <<'SMOKE'
          #!/usr/bin/env bash
          set -euo pipefail

          [[ $# -eq 3 ]] || {
            echo "Usage: $0 ISO bios|uefi LOG_ROOT" >&2
            exit 2
          }

          iso=$(readlink -f "$1")
          mode=$2
          log_root=$(readlink -m "$3")
          timeout_s=${QEMU_TIMEOUT:-600}

          [[ -s $iso ]] || { echo "ISO missing: $iso" >&2; exit 2; }
          [[ $mode == bios || $mode == uefi ]] || { echo "mode must be bios or uefi" >&2; exit 2; }

          mkdir -p "$log_root"
          pid=''

          stop_vm() {
            local victim=${1:-}
            if [[ -n $victim ]] && kill -0 "$victim" 2>/dev/null; then
              kill "$victim" 2>/dev/null || true
            fi
            if [[ -n $victim ]]; then
              wait "$victim" 2>/dev/null || true
            fi
            pid=''
          }

          wait_for_marker() {
            local victim=$1
            local serial_log=$2
            local marker=$3
            local seconds=$4
            local deadline=$((SECONDS + seconds))
            LAST_QEMU_RC=0

            while (( SECONDS < deadline )); do
              if grep -q "$marker" "$serial_log" 2>/dev/null; then
                grep "$marker" "$serial_log" | tail -n1
                return 0
              fi

              if ! kill -0 "$victim" 2>/dev/null; then
                set +e
                wait "$victim"
                LAST_QEMU_RC=$?
                set -e
                pid=''
                return 10
              fi

              sleep 2
            done

            return 11
          }

          run_primary() {
            local serial="$log_root/primary-serial.log"
            local stderr="$log_root/primary-qemu.stderr"
            local debug="$log_root/primary-qemu-debug.log"
            : > "$serial"; : > "$stderr"; : > "$debug"

            local -a args=(
              -machine q35,accel=tcg
              -m 3072
              -smp 2
              -cpu max
              -vga std
              -display none
              -serial "file:$serial"
              -monitor none
              -no-reboot
              -net none
              -d guest_errors,cpu_reset
              -D "$debug"
              -drive "if=none,id=privora_live,format=raw,readonly=on,file=$iso"
              -device "virtio-blk-pci,drive=privora_live,bootindex=1"
            )

            if [[ $mode == uefi ]]; then
              local fw=''
              local vars=''

              for candidate in \
                /usr/share/OVMF/OVMF_CODE_4M.fd \
                /usr/share/OVMF/OVMF_CODE.fd; do
                if [[ -r $candidate ]]; then fw=$candidate; break; fi
              done

              for candidate in \
                /usr/share/OVMF/OVMF_VARS_4M.fd \
                /usr/share/OVMF/OVMF_VARS.fd; do
                if [[ -r $candidate ]]; then vars=$candidate; break; fi
              done

              [[ -n $fw && -n $vars ]] || {
                echo "OVMF firmware not found" >&2
                return 127
              }

              cp "$vars" "$log_root/vars.fd"
              args+=(
                -drive "if=pflash,format=raw,readonly=on,file=$fw"
                -drive "if=pflash,format=raw,file=$log_root/vars.fd"
              )
            fi

            echo "Starting real $mode ISO-hybrid raw-disk boot..."
            qemu-system-x86_64 "${args[@]}" \
              >"$log_root/primary-qemu.stdout" 2>"$stderr" &
            pid=$!

            set +e
            wait_for_marker "$pid" "$serial" 'PRIVORA_LIVE_BOOT_OK' "$timeout_s"
            local result=$?
            set -e

            if [[ $result -eq 0 ]]; then
              stop_vm "$pid"
              echo "PRIMARY_${mode^^}=PASS"
              return 0
            fi

            if [[ $result -eq 10 ]]; then
              echo "Primary $mode QEMU exited before marker; qemu_rc=$LAST_QEMU_RC" >&2
            else
              echo "Primary $mode timed out waiting for PRIVORA_LIVE_BOOT_OK" >&2
              stop_vm "$pid"
            fi

            echo '--- primary serial tail ---' >&2
            tail -n 320 "$serial" >&2 || true
            echo '--- primary qemu stderr tail ---' >&2
            tail -n 180 "$stderr" >&2 || true
            echo '--- primary qemu reset/guest-error tail ---' >&2
            tail -n 220 "$debug" >&2 || true
            return 1
          }

          run_bios_optical_probe() {
            local serial="$log_root/optical-serial.log"
            local stderr="$log_root/optical-qemu.stderr"
            local debug="$log_root/optical-qemu-debug.log"
            : > "$serial"; : > "$stderr"; : > "$debug"

            echo 'Running BIOS El Torito optical-media probe...' >&2
            qemu-system-x86_64 \
              -machine q35,accel=tcg \
              -m 3072 -smp 2 -cpu max \
              -vga std -display none \
              -serial "file:$serial" \
              -monitor none -no-reboot -net none \
              -d guest_errors,cpu_reset \
              -D "$debug" \
              -boot order=d,menu=off \
              -cdrom "$iso" \
              >"$log_root/optical-qemu.stdout" 2>"$stderr" &
            pid=$!

            local optical_timeout=$timeout_s
            (( optical_timeout > 360 )) && optical_timeout=360

            set +e
            wait_for_marker "$pid" "$serial" 'PRIVORA_LIVE_BOOT_OK' "$optical_timeout"
            local result=$?
            set -e

            if [[ $result -eq 0 ]]; then
              stop_vm "$pid"
              echo 'BIOS_OPTICAL=PASS'
              return 0
            fi

            if [[ $result -eq 10 ]]; then
              echo "Optical BIOS QEMU exited before marker; qemu_rc=$LAST_QEMU_RC" >&2
            else
              echo 'Optical BIOS probe timed out.' >&2
              stop_vm "$pid"
            fi

            echo '--- optical serial tail ---' >&2
            tail -n 260 "$serial" >&2 || true
            echo '--- optical qemu stderr tail ---' >&2
            tail -n 140 "$stderr" >&2 || true
            echo '--- optical qemu reset/guest-error tail ---' >&2
            tail -n 180 "$debug" >&2 || true
            return 1
          }

          run_direct_kernel_probe() {
            local direct="$log_root/direct"
            mkdir -p "$direct"

            xorriso -osirrox on -indev "$iso" \
              -extract /live/vmlinuz "$direct/vmlinuz" >/dev/null 2>&1
            xorriso -osirrox on -indev "$iso" \
              -extract /live/initrd.img "$direct/initrd.img" >/dev/null 2>&1

            local serial="$log_root/direct-serial.log"
            local stderr="$log_root/direct-qemu.stderr"
            local debug="$log_root/direct-qemu-debug.log"
            : > "$serial"; : > "$stderr"; : > "$debug"

            echo 'Running direct-kernel + same-hybrid-media probe...' >&2
            qemu-system-x86_64 \
              -machine q35,accel=tcg \
              -m 3072 -smp 2 -cpu max \
              -vga std -display none \
              -serial "file:$serial" \
              -monitor none -no-reboot -net none \
              -d guest_errors,cpu_reset \
              -D "$debug" \
              -drive "if=none,id=privora_live,format=raw,readonly=on,file=$iso" \
              -device "virtio-blk-pci,drive=privora_live" \
              -kernel "$direct/vmlinuz" \
              -initrd "$direct/initrd.img" \
              -append "boot=live components live-media=/dev/vda live-media-timeout=30 debug=1 console=tty0 console=ttyS0,115200 systemd.unit=multi-user.target" \
              >"$log_root/direct-qemu.stdout" 2>"$stderr" &
            pid=$!

            set +e
            wait_for_marker "$pid" "$serial" 'PRIVORA_LIVE_BOOT_OK' 360
            local result=$?
            set -e

            if [[ $result -eq 0 ]]; then
              stop_vm "$pid"
              echo 'DIRECT_KERNEL=PASS'
              return 0
            fi

            if [[ $result -eq 10 ]]; then
              echo "Direct-kernel QEMU exited before marker; qemu_rc=$LAST_QEMU_RC" >&2
            else
              echo 'Direct-kernel probe timed out.' >&2
              stop_vm "$pid"
            fi

            echo '--- direct-kernel serial tail ---' >&2
            tail -n 340 "$serial" >&2 || true
            echo '--- direct-kernel qemu stderr tail ---' >&2
            tail -n 160 "$stderr" >&2 || true
            echo '--- direct-kernel qemu reset/guest-error tail ---' >&2
            tail -n 200 "$debug" >&2 || true
            return 1
          }

          if run_primary; then
            exit 0
          fi

          optical_rc=99
          if [[ $mode == bios ]]; then
            set +e
            run_bios_optical_probe
            optical_rc=$?
            set -e
          fi

          set +e
          run_direct_kernel_probe
          direct_rc=$?
          set -e

          if [[ $mode == bios && $optical_rc -eq 0 ]]; then
            echo 'DIAGNOSTIC: BIOS El Torito optical boot passes while raw ISO-hybrid disk boot fails.' >&2
            echo 'DIAGNOSTIC: remaining fault is isolated to the BIOS isohybrid/raw-disk launch path.' >&2
            exit 5
          fi

          if [[ $direct_rc -eq 0 ]]; then
            echo "DIAGNOSTIC: live kernel/userspace and the reused medium are good; $mode firmware/bootloader/media-launch path remains." >&2
            exit 5
          fi

          echo "DIAGNOSTIC: direct-kernel/live-userspace probe also failed after $mode primary failure." >&2
          exit 6
          SMOKE

          chmod +x "$BUILDROOT/tools/qemu-live-diagnostic.sh"
          bash -n "$BUILDROOT/tools/qemu-live-diagnostic.sh"

      - name: Run BIOS and UEFI diagnostics on reused v21 ISO
        id: diag
        shell: bash
        run: |
          set -uxo pipefail

          mkdir -p "$BUILDROOT/logs/bios" "$BUILDROOT/logs/uefi"

          set +e
          QEMU_TIMEOUT=600 "$BUILDROOT/tools/qemu-live-diagnostic.sh" \
            "$ISO" bios "$BUILDROOT/logs/bios" \
            2>&1 | tee "$BUILDROOT/logs/BIOS-CONSOLE.txt"
          BIOS_RC=${PIPESTATUS[0]}

          QEMU_TIMEOUT=600 "$BUILDROOT/tools/qemu-live-diagnostic.sh" \
            "$ISO" uefi "$BUILDROOT/logs/uefi" \
            2>&1 | tee "$BUILDROOT/logs/UEFI-CONSOLE.txt"
          UEFI_RC=${PIPESTATUS[0]}
          set -e

          {
            echo "Privora 4.0 RC3 v23 reused-v21-ISO diagnostic result"
            echo "source artifact: $CANDIDATE_ARTIFACT"
            echo "source artifact id: ${{ steps.artifact.outputs.artifact_id }}"
            echo "source workflow run: ${{ steps.artifact.outputs.source_run_id }}"
            echo "BIOS_RC=$BIOS_RC"
            echo "UEFI_RC=$UEFI_RC"
            echo
            echo "Return codes:"
            echo "  0 = real ISO-hybrid path reached PRIVORA_LIVE_BOOT_OK"
            echo "  5 = diagnostic probe isolated the failure below the requested primary path"
            echo "  6 = direct-kernel/live-userspace probe also failed"
          } | tee "$BUILDROOT/logs/V23-SUMMARY.txt"

          echo "bios_rc=$BIOS_RC" >> "$GITHUB_OUTPUT"
          echo "uefi_rc=$UEFI_RC" >> "$GITHUB_OUTPUT"

          # This workflow is a diagnostic/certification continuation, not a way
          # to convert a diagnostic-only success into release certification.
          if [ "$BIOS_RC" -ne 0 ] || [ "$UEFI_RC" -ne 0 ]; then
            exit 20
          fi

      - name: Write live-boot certification continuation record
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$BUILDROOT/output/LIVE-BOOT-CERTIFICATION-v23.txt" <<EOF
          Privora 4.0 RC3 — v23 reused-v21-ISO certification continuation

          Source GitHub Actions artifact:
            $CANDIDATE_ARTIFACT

          Source artifact ID:
            ${{ steps.artifact.outputs.artifact_id }}

          Source workflow run:
            ${{ steps.artifact.outputs.source_run_id }}

          BIOS ISO-hybrid live boot:
            PASS

          UEFI ISO-hybrid live boot:
            PASS

          IMPORTANT:
          This does not certify disposable installation or installed-system boot.
          Those gates still require the RC3 source/installer certification harness
          or a subsequent full build/certification workflow.
          EOF

      - name: Upload v23 diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Privora-4.0-RC3-v23-Reused-v21-ISO-Diagnostics
          path: ${{ runner.temp }}/privora-v23/logs/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Upload reused ISO plus live-boot record
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Privora-4.0-RC3-v23-Live-Boot-Passed-Reused-v21-ISO
          path: ${{ runner.temp }}/privora-v23/output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
