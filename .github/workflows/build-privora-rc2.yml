name: Build Privora 4.0 RC3 — Reconstructed v28 — Full Certification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af --volumes || true
          sudo apt-get clean || true
          df -h /

      - name: Select exact reconstructed RC3 v28 source
        shell: bash
        run: |
          set -euxo pipefail
          EXPECTED_SHA256='bd2859cd0b5544d027d16e8a7d208f446af2152ffa575f88ad5981a363e55d8f'
          EXPECTED_NAME='Privora-4.0-RC3-Reconstructed-v28-Web-Source.zip'

          SOURCE_ZIP=$(find . -maxdepth 3 -type f -name "$EXPECTED_NAME" -print -quit)
          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: $EXPECTED_NAME is not present in the repository." >&2
            echo 'Upload the reconstructed v28 source ZIP beside this workflow; do not substitute RC2 or the lost v21 hash.' >&2
            find . -maxdepth 3 -type f -printf '%p\n' | sort | head -n 400 >&2
            exit 28
          fi

          actual=$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')
          echo "source=$SOURCE_ZIP"
          echo "sha256=$actual"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: reconstructed source checksum mismatch." >&2
            echo "Expected: $EXPECTED_SHA256" >&2
            echo "Actual:   $actual" >&2
            exit 29
          fi

          unzip -t "$SOURCE_ZIP" >/dev/null
          BUILDROOT="$RUNNER_TEMP/privora-build"
          rm -rf "$BUILDROOT"
          mkdir -p "$BUILDROOT/src" "$BUILDROOT/output"
          unzip -q "$SOURCE_ZIP" -d "$BUILDROOT/src"

          test "$(tr -d '\r\n' < "$BUILDROOT/src/VERSION")" = '4.0-rc3'
          test "$(tr -d '\r\n' < "$BUILDROOT/src/prism/VERSION")" = '1.1.0'
          test -f "$BUILDROOT/src/RECONSTRUCTION-PROVENANCE.md"
          test -f "$BUILDROOT/src/distro/config/includes.chroot/etc/privora/reconstruction"
          grep -Fq 'reconstructed source baseline v28' "$BUILDROOT/src/distro/config/includes.chroot/etc/privora/reconstruction"
          test -f "$BUILDROOT/src/tests/systemd-context-safety-test.py"
          test -f "$BUILDROOT/src/tests/bios-graphical-boot-safety-test.py"
          test -f "$BUILDROOT/src/tests/rc3-consumer-experience-test.py"
          test -x "$BUILDROOT/src/ci/validate-rc3-reconstructed.sh"

          chmod -R u+rwX "$BUILDROOT/src"
          find "$BUILDROOT/src" -type f -name '*.sh' -exec chmod +x {} +
          echo "BUILDROOT=$BUILDROOT" >> "$GITHUB_ENV"
          echo 'PASS: exact reconstructed RC3 v28 source selected'

      - name: Start Debian 13 build container
        shell: bash
        run: |
          set -euxo pipefail
          docker pull debian:13
          docker run -d --name privora-builder --privileged             -v "$BUILDROOT:/work"             debian:13 sleep infinity
          docker exec privora-builder bash -lc 'cat /etc/debian_version; df -h / /work'

      - name: Configure Debian 13 build environment
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cat > /etc/apt/sources.list.d/debian.sources <<'SOURCES'
          Types: deb
          URIs: http://deb.debian.org/debian
          Suites: trixie trixie-updates
          Components: main contrib non-free non-free-firmware
          Architectures: amd64
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: http://deb.debian.org/debian-security
          Suites: trixie-security
          Components: main contrib non-free non-free-firmware
          Architectures: amd64
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          SOURCES

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             ca-certificates git unzip xz-utils live-build debootstrap squashfs-tools xorriso             syslinux-common isolinux grub-pc-bin grub-efi-amd64-bin shim-signed             dosfstools e2fsprogs btrfs-progs xfsprogs cryptsetup mtools             dpkg-dev python3 python3-pil gzip coreutils gcc binutils file
          for tool in gcc ld readelf nm file dpkg-deb dpkg-scanpackages xorriso lb python3; do
            command -v "$tool" >/dev/null || { echo "Missing build tool: $tool" >&2; exit 127; }
          done
          CONTAINER

      - name: Validate reconstructed permanent source
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cd /work/src
          ./ci/validate-rc3-reconstructed.sh
          rm -rf release/.deb-work release/debs prism/.build prism/dist
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          CONTAINER

      - name: Build reconstructed Privora Prism installer ISO
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cd /work/src/distro
          DESKTOP=privora EDITION=standard INSTALLER=1 OFFLINE_REPO=1 PERSISTENCE=auto ./build.sh
          ISO=$(find . -maxdepth 1 -type f -name 'Privora-4.0-rc3-Installer-privora-standard-amd64.iso' -print -quit)
          test -n "$ISO"
          test -s "$ISO"
          mv "$ISO" /work/output/
          if [ -f "$ISO.sha256" ]; then mv "$ISO.sha256" /work/output/; fi
          cd /work/output
          sha256sum Privora-4.0-rc3-Installer-privora-standard-amd64.iso > SHA256SUMS.txt
          cp /work/src/RECONSTRUCTION-PROVENANCE.md .
          cp /work/src/release/RC3-RECONSTRUCTED-v28-VALIDATION.txt .
          cd /work/src/distro
          lb clean --purge || true
          rm -rf chroot binary cache .build || true
          CONTAINER

      - name: Verify finished ISO boot and provenance payload
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          ISO=/work/output/Privora-4.0-rc3-Installer-privora-standard-amd64.iso
          test -s "$ISO"
          for path in /live/vmlinuz /live/initrd.img /live/filesystem.squashfs; do
            xorriso -indev "$ISO" -find "$path" -type f -- | grep -Fq "$path"
          done

          bootcheck=$(mktemp -d)
          xorriso -osirrox on -indev "$ISO" -extract /isolinux/isolinux.cfg "$bootcheck/isolinux.cfg" >/dev/null 2>&1
          cat "$bootcheck/isolinux.cfg"
          ! grep -Eqi '^[[:space:]]*ONTIMEOUT([[:space:]]|$)' "$bootcheck/isolinux.cfg"
          grep -Fq 'UI vesamenu.c32' "$bootcheck/isolinux.cfg"
          grep -Fq 'DEFAULT live' "$bootcheck/isolinux.cfg"
          grep -Fq 'MENU DEFAULT' "$bootcheck/isolinux.cfg"
          grep -Fq 'MENU BACKGROUND privora-boot-center.jpg' "$bootcheck/isolinux.cfg"
          grep -Fq 'TIMEOUT 200' "$bootcheck/isolinux.cfg"
          grep -Fq 'MENU MARGIN 8' "$bootcheck/isolinux.cfg"
          grep -Fq 'MENU WIDTH 64' "$bootcheck/isolinux.cfg"
          ! grep -Fq 'MENU RESOLUTION' "$bootcheck/isolinux.cfg"
          grep -Fq 'LABEL installcompat' "$bootcheck/isolinux.cfg"
          grep -Fq 'privora.mode=install nomodeset privora.installer.compat=1' "$bootcheck/isolinux.cfg"
          grep -Fq 'LABEL console' "$bootcheck/isolinux.cfg"
          grep -Fq 'privora.mode=console systemd.unit=multi-user.target' "$bootcheck/isolinux.cfg"
          grep -Fq 'privora.recovery=1' "$bootcheck/isolinux.cfg"
          ! grep -Fq 'privora.recovery=1 systemd.unit=multi-user.target' "$bootcheck/isolinux.cfg"

          for path in /isolinux/isolinux.bin /isolinux/vesamenu.c32 /isolinux/ldlinux.c32 /isolinux/libcom32.c32 /isolinux/libutil.c32 /isolinux/reboot.c32 /isolinux/poweroff.c32; do
            xorriso -indev "$ISO" -find "$path" -type f -- | grep -Fq "$path"
          done
          xorriso -osirrox on -indev "$ISO" -extract /isolinux/privora-boot-center.jpg "$bootcheck/boot.jpg" >/dev/null 2>&1
          file "$bootcheck/boot.jpg" | tee "$bootcheck/file.txt"
          grep -Fq 'JPEG image data' "$bootcheck/file.txt"
          grep -Fq '640x480' "$bootcheck/file.txt"

          # Prove the reconstruction marker is inside the live filesystem source
          # tree used by live-build. The generated SquashFS itself is additionally
          # exercised by QEMU below.
          grep -Fq 'reconstructed source baseline v28' /work/src/distro/config/includes.chroot/etc/privora/reconstruction
          xorriso -indev "$ISO" -report_el_torito plain || true
          xorriso -indev "$ISO" -report_system_area plain || true
          rm -rf "$bootcheck"
          CONTAINER

      - name: Upload ISO candidate before VM certification
        uses: actions/upload-artifact@v6
        with:
          name: Privora-4.0-RC3-Reconstructed-v28-ISO-Candidate-Uncertified
          path: ${{ runner.temp }}/privora-build/output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Install QEMU certification tools
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
          apt-get clean
          rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/*
          CONTAINER

      - name: Certify BIOS, UEFI, and disposable installation
        shell: bash
        run: |
          set -euxo pipefail
          docker exec -i privora-builder bash -s <<'CONTAINER'
          set -euxo pipefail
          cd /work/src
          ISO=/work/output/Privora-4.0-rc3-Installer-privora-standard-amd64.iso

          QEMU_TIMEOUT=600 ./ci/qemu-live-smoke.sh "$ISO" bios
          QEMU_TIMEOUT=600 ./ci/qemu-live-smoke.sh "$ISO" uefi
          QEMU_TIMEOUT=1200 ./installer/vm/run-install-core-certification.sh "$ISO"

          cat > /work/output/CERTIFICATION.txt <<'EOF'
          Privora 4.0 RC3 — Reconstructed v28
          Privora Prism Environment 1.1

          Reconstructed source identity: VERIFIED
          BIOS ISO-hybrid live boot: PASS
          UEFI ISO-hybrid live boot: PASS
          Disposable UEFI install/write: PASS
          Installed-system boot marker: PASS

          This certifies the reconstructed v28 baseline, not the lost byte-identical v21 source archive.
          EOF
          CONTAINER

      - name: Add Windows USB instructions
        if: success()
        shell: bash
        run: |
          cat > "$BUILDROOT/output/FLASH-TO-USB-WINDOWS.txt" <<'EOF'
          Privora 4.0 RC3 — Reconstructed v28 — Privora Prism 1.1

          1. Verify the ISO against SHA256SUMS.txt.
          2. Open Rufus on Windows.
          3. Select Privora-4.0-rc3-Installer-privora-standard-amd64.iso.
          4. For a modern PC, use GPT / UEFI.
          5. Write the image to the USB drive; the selected USB is erased.
          6. Boot from the UEFI USB entry.
          7. Choose Try Privora Live or Install Privora.
          8. Live login fallback: user `privora`, password `live`.
          9. The source provenance marker is retained under /etc/privora/reconstruction.
          EOF

      - name: Upload certified reconstructed RC3 ISO
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Privora-4.0-RC3-Reconstructed-v28-Certified-Installer-Prism-1.1-amd64
          path: ${{ runner.temp }}/privora-build/output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Stop build container
        if: always()
        shell: bash
        run: docker rm -f privora-builder >/dev/null 2>&1 || true
